name: Web + Worker deploy

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "workers/**"
      - "package.json"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: false

jobs:
  deploy-api:
    name: Deploy facemax-api Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify Cloudflare deployment settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN secret is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID repository variable is missing"; exit 1; }

      - name: Install Wrangler
        run: npm i -g wrangler@3

      - name: Deploy
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --minify

      - name: Deploy Web to Cloudflare Pages
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 -c '
          import os, sys, json, urllib.request, urllib.error, subprocess

          token = os.environ.get("CLOUDFLARE_API_TOKEN", "").strip()
          account_id = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()

          def cf_api(method, path, data=None):
              url = f"https://api.cloudflare.com/client/v4{path}"
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json"
              }
              body = json.dumps(data).encode("utf-8") if data else None
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.loads(resp.read().decode("utf-8"))
              except urllib.error.HTTPError as e:
                  err_body = e.read().decode("utf-8")
                  print(f"CF API {method} {path} HTTP {e.code}: {err_body}")
                  try:
                      return json.loads(err_body)
                  except Exception:
                      return {"success": False, "error": err_body}
              except Exception as e:
                  print(f"CF API {method} {path} error: {e}")
                  return {"success": False, "error": str(e)}

          print("=== 1. CLOUDFLARE ZONES ===")
          zones = cf_api("GET", "/zones")
          if zones.get("success"):
              for z in zones.get("result", []):
                  print(f"Zone: {z.get('name')} | id: {z.get('id')} | status: {z.get('status')}")
          else:
              print("Zones result:", zones)

          print("\n=== 2. CLOUDFLARE PAGES PROJECTS ===")
          projects_res = cf_api("GET", f"/accounts/{account_id}/pages/projects")
          project_names = []
          if projects_res.get("success"):
              for p in projects_res.get("result", []):
                  pname = p.get("name")
                  project_names.append(pname)
                  subdomain = p.get("subdomain")
                  domains = [d.get("name") for d in p.get("domains", [])]
                  print(f"Pages Project: {pname} -> {subdomain}.pages.dev (domains: {domains})")
          else:
              print("Pages projects result:", projects_res)

          # Dedicated project strictly for FaceMax / Mogly (NEVER flora-ai!)
          target_project = "facemaxaiapp"
          if target_project not in project_names:
              print(f"\nCreating Cloudflare Pages project: {target_project}...")
              create_res = cf_api("POST", f"/accounts/{account_id}/pages/projects", {
                  "name": target_project,
                  "production_branch": "main"
              })
              print("Create project response:", create_res)

          print(f"\n=== 3. DEPLOYING WEB TO {target_project} ===")
          deploy_cmd = ["wrangler", "pages", "deploy", "web", f"--project-name={target_project}", "--branch=main"]
          print("Running:", " ".join(deploy_cmd))
          subprocess.run(deploy_cmd, check=True)

          print("\n=== 4. ATTACHING CUSTOM DOMAINS ===")
          for dom in ["facemaxaiapp.com", "www.facemaxaiapp.com"]:
              print(f"Attaching custom domain: {dom} to {target_project}...")
              dom_res = cf_api("POST", f"/accounts/{account_id}/pages/projects/{target_project}/domains", {
                  "name": dom
              })
              print(f"Domain {dom} attach result:", dom_res)
          '

      - name: Verify deployed current-app-compatible Worker
        env:
          HEALTH_URL: https://facemax-api.maks200r1.workers.dev/health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            body="$(curl -fsS --max-time 15 "$HEALTH_URL" || true)"
            if BODY="$body" node -e 'try { const d=JSON.parse(process.env.BODY||""); process.exit(d.ok===true && d.build==="meal-plan-v3-current-app-compatible" && d.meal_plan_schema_version===3 ? 0 : 1); } catch { process.exit(1); }'; then
              echo "Verified Meal Plan Worker compatible with the current iOS app"
              exit 0
            fi
            echo "Verification attempt $attempt failed; retrying..."
            sleep 5
          done
          echo "The public Worker does not report the expected build. Last response: $body"
          exit 1
