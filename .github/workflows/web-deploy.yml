name: Web + Worker deploy

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "workers/**"
      - "package.json"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: false

jobs:
  deploy-api:
    name: Deploy facemax-api Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify Cloudflare deployment settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN secret is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID repository variable is missing"; exit 1; }

      - name: Install Wrangler
        run: npm i -g wrangler@3

      - name: Deploy
        working-directory: workers/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --minify

      - name: Deploy Web to Cloudflare Pages
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 -c '
          import subprocess, sys, re
          res = subprocess.run(["wrangler", "pages", "project", "list"], capture_output=True, text=True)
          print("=== CLOUDFLARE PAGES PROJECTS ===")
          print(res.stdout)
          if res.stderr:
              print(res.stderr)
          
          # Match lines in table or output
          names = []
          for line in res.stdout.splitlines():
              m = re.findall(r"│\s*([a-zA-Z0-9_\-\.]+)\s*│", line)
              for cand in m:
                  cand = cand.strip()
                  if cand and cand not in ("Project Name", "Project Domains", "Git Provider", "Last Modified"):
                      names.append(cand)
          
          print("Extracted candidates:", names)
          target = None
          for n in names:
              if any(k in n.lower() for k in ["facemax", "mogly", "look", "beauty"]):
                  target = n
                  break
          if not target and names:
              target = names[0]
          
          print("Target project to deploy:", target)
          if target:
              cmd = ["wrangler", "pages", "deploy", "web", f"--project-name={target}"]
              print("Running:", " ".join(cmd))
              subprocess.run(cmd, check=True)
          else:
              print("No existing project found, creating facemaxaiapp...")
              subprocess.run(["wrangler", "pages", "project", "create", "facemaxaiapp", "--production-branch=main"], check=False)
              subprocess.run(["wrangler", "pages", "deploy", "web", "--project-name=facemaxaiapp"], check=True)
          '

      - name: Verify deployed current-app-compatible Worker
        env:
          HEALTH_URL: https://facemax-api.maks200r1.workers.dev/health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            body="$(curl -fsS --max-time 15 "$HEALTH_URL" || true)"
            if BODY="$body" node -e 'try { const d=JSON.parse(process.env.BODY||""); process.exit(d.ok===true && d.build==="meal-plan-v3-current-app-compatible" && d.meal_plan_schema_version===3 ? 0 : 1); } catch { process.exit(1); }'; then
              echo "Verified Meal Plan Worker compatible with the current iOS app"
              exit 0
            fi
            echo "Verification attempt $attempt failed; retrying..."
            sleep 5
          done
          echo "The public Worker does not report the expected build. Last response: $body"
          exit 1
